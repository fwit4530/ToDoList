<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相川さんのToDoリスト</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif; background: #f5f5f0; min-height: 100vh; padding: 1rem; }
.app { max-width: 600px; margin: 0 auto; background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
.progress-wrap { background: #f0f0ea; border-radius: 8px; height: 8px; margin-bottom: 1.5rem; overflow: hidden; }
.progress-bar { height: 100%; background: #3b82f6; border-radius: 8px; transition: width 0.4s ease; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.5rem; }
.stat { background: #f8f8f5; border-radius: 10px; padding: 0.75rem; text-align: center; }
.stat-num { font-size: 22px; font-weight: 600; color: #1a1a1a; }
.stat-label { font-size: 12px; color: #888; margin-top: 2px; }
.input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
.input-row input { flex: 1; height: 40px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; font-size: 14px; outline: none; font-family: inherit; }
.input-row input:focus { border-color: #3b82f6; }
select { height: 40px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 13px; padding: 0 8px; cursor: pointer; font-family: inherit; }
button { height: 40px; padding: 0 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 500; }
button:hover { background: #2563eb; }
.filter-row { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.filter-btn { height: 30px; padding: 0 12px; border-radius: 100px; border: 1px solid #ddd; background: white; color: #666; cursor: pointer; font-size: 12px; font-family: inherit; }
.filter-btn.active { background: #eff6ff; color: #3b82f6; border-color: #93c5fd; }
.todo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
.todo-item { background: #fafaf8; border: 1px solid #efefeb; border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.todo-item.done { opacity: 0.55; }
.todo-item.done .todo-text { text-decoration: line-through; color: #999; }
.check-btn { width: 22px; height: 22px; border: 1.5px solid #ccc; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: white; transition: all 0.2s; }
.check-btn.checked { background: #3b82f6; border-color: #3b82f6; color: white; font-size: 13px; }
.todo-text { flex: 1; font-size: 14px; color: #1a1a1a; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 100px; flex-shrink: 0; }
.badge.high { background: #fee2e2; color: #dc2626; }
.badge.mid { background: #fef3c7; color: #d97706; }
.badge.low { background: #dcfce7; color: #16a34a; }
.del-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 18px; padding: 0 2px; line-height: 1; }
.del-btn:hover { color: #ef4444; }
.empty { text-align: center; padding: 2rem; color: #aaa; font-size: 14px; }
.sync-note { font-size: 12px; color: #666; text-align: center; padding: 10px; background: #eff6ff; border-radius: 8px; border: 1px solid #bfdbfe; }
.clear-btn { width: 100%; margin-top: 12px; background: #fee2e2; color: #dc2626; border: none; border-radius: 8px; height: 36px; font-size: 13px; cursor: pointer; font-family: inherit; }
.clear-btn:hover { background: #fecaca; }
</style>
</head>
<body>
<div class="app">
  <h1>相川さんのToDoリスト</h1>
  <p class="subtitle" id="sync-time">読み込み中...</p>

  <div class="progress-wrap"><div class="progress-bar" id="prog" style="width:0%"></div></div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="s-all">0</div><div class="stat-label">全タスク</div></div>
    <div class="stat"><div class="stat-num" id="s-done">0</div><div class="stat-label">完了</div></div>
    <div class="stat"><div class="stat-num" id="s-left">0</div><div class="stat-label">残り</div></div>
  </div>

  <div class="input-row">
    <input type="text" id="new-task" placeholder="新しいタスクを入力..." />
    <select id="priority">
      <option value="high">🔴 高</option>
      <option value="mid" selected>🟡 中</option>
      <option value="low">🟢 低</option>
    </select>
    <button onclick="addTask()">追加</button>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all',this)">すべて</button>
    <button class="filter-btn" onclick="setFilter('left',this)">未完了</button>
    <button class="filter-btn" onclick="setFilter('done',this)">完了済み</button>
    <button class="filter-btn" onclick="setFilter('high',this)">🔴 高優先</button>
  </div>

  <div class="todo-list" id="list"></div>

  <div class="sync-note">💾 データはこのブラウザに自動保存されます。URLを共有すると同じページで使えます。</div>
  <button class="clear-btn" onclick="clearDone()">完了済みタスクを削除</button>
</div>

<script>
const KEY = 'aikawa_todo_v2';
let filter = 'all';
let tasks = [];

function load() {
  const saved = localStorage.getItem(KEY);
  if (saved) {
    tasks = JSON.parse(saved);
  } else {
    tasks = [
      { id: 1, text: '毎日noteの偉人シリーズ更新', done: false, priority: 'high' },
      { id: 2, text: '真ほろばへの書類郵送', done: false, priority: 'high' },
      { id: 3, text: '松尾芭蕉の動画撮影・アップロード', done: false, priority: 'mid' },
      { id: 4, text: 'Jimdoホームページを更新する', done: false, priority: 'mid' },
      { id: 5, text: 'セイロンシナモンを購入する', done: false, priority: 'low' },
    ];
    save();
  }
  updateTime();
  render();
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(tasks));
  updateTime();
}

function updateTime() {
  const now = new Date();
  document.getElementById('sync-time').textContent =
    '最終保存: ' + now.toLocaleString('ja-JP', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function addTask() {
  const inp = document.getElementById('new-task');
  const pri = document.getElementById('priority').value;
  const text = inp.value.trim();
  if (!text) { inp.focus(); return; }
  tasks.unshift({ id: Date.now(), text, done: false, priority: pri });
  inp.value = '';
  save();
  render();
}

function toggle(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

function del(id) {
  if (!confirm('このタスクを削除しますか？')) return;
  tasks = tasks.filter(t => t.id !== id);
  save();
  render();
}

function clearDone() {
  const cnt = tasks.filter(t => t.done).length;
  if (!cnt) { alert('完了済みのタスクはありません'); return; }
  if (!confirm(cnt + '件の完了済みタスクを削除しますか？')) return;
  tasks = tasks.filter(t => !t.done);
  save();
  render();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const all = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const left = all - done;
  document.getElementById('s-all').textContent = all;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-left').textContent = left;
  document.getElementById('prog').style.width = all ? Math.round(done / all * 100) + '%' : '0%';

  let filtered = tasks;
  if (filter === 'done') filtered = tasks.filter(t => t.done);
  else if (filter === 'left') filtered = tasks.filter(t => !t.done);
  else if (filter === 'high') filtered = tasks.filter(t => t.priority === 'high');

  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">タスクがありません</div>';
    return;
  }
  list.innerHTML = filtered.map(t => `
    <div class="todo-item ${t.done ? 'done' : ''}">
      <div class="check-btn ${t.done ? 'checked' : ''}" onclick="toggle(${t.id})">${t.done ? '✓' : ''}</div>
      <span class="todo-text">${t.text}</span>
      <span class="badge ${t.priority}">${t.priority === 'high' ? '高優先' : t.priority === 'mid' ? '中' : '低'}</span>
      <button class="del-btn" onclick="del(${t.id})">×</button>
    </div>
  `).join('');
}

document.getElementById('new-task').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

load();
</script>
</body>
</html>
